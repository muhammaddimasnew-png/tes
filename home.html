<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Aplikasi Daftar Tugas Mahasiswa</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>

<link rel="stylesheet" href="style1.css">

</head>

<body>

<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm fixed-top">
<div class="container-fluid">

<a class="navbar-brand fw-bold">
<i class="bi bi-journal-check text-primary"></i>
Aplikasi Daftar Tugas Mahasiswa
</a>

<button class="navbar-toggler"
type="button"
data-bs-toggle="collapse"
data-bs-target="#navbarMenu">

<span class="navbar-toggler-icon"></span>

</button>

<div class="collapse navbar-collapse" id="navbarMenu">

<div class="ms-auto d-flex align-items-center gap-3 fs-5">

    <i class="bi bi-bell-fill"></i>

    <i class="bi bi-person-circle"></i>

    <div class="dropdown">

        <i class="bi bi-list"
           role="button"
           data-bs-toggle="dropdown"
           aria-expanded="false"></i>

        <ul class="dropdown-menu dropdown-menu-end">

            <li>
                <a class="dropdown-item" href="#">
                    <i class="bi bi-house-door"></i>
                    Home
                </a>
            </li>

            <li>
                <a class="dropdown-item" href="#">
                    <i class="bi bi-speedometer2"></i>
                    Dashboard
                </a>
            </li>

            <li>
                <a class="dropdown-item" href="#">
                    <i class="bi bi-plus-square"></i>
                    Input Tugas
                </a>
            </li>

            <li>
                <a class="dropdown-item" href="#">
                    <i class="bi bi-file-earmark-text"></i>
                    Laporan
                </a>
            </li>

            <li>
                <hr class="dropdown-divider">
            </li>

            <li>
                <a class="dropdown-item text-danger"
                   href="index.html">

                    <i class="bi bi-box-arrow-right"></i>
                    Logout

                </a>
            </li>

        </ul>

    </div>

</div>

</div>
</div>
</nav>

<div class="container mt-5 pt-5">

<h2 class="fw-bold mb-4">
Dashboard Mahasiswa
</h2>

<div class="row g-3 mb-4">

<div class="col-md-4">
<div class="card shadow-sm">
<div class="card-body text-center">
<h6>Tugas Aktif</h6>
<h2 id="aktif" class="text-primary">0</h2>
</div>
</div>
</div>

<div class="col-md-4">
<div class="card shadow-sm">
<div class="card-body text-center">
<h6>Total Tugas</h6>
<h2 id="totalTugas">0</h2>
</div>
</div>
</div>

<div class="col-md-4">
<div class="card shadow-sm">
<div class="card-body text-center">
<h6>Selesai</h6>
<h2 id="selesai" class="text-success">0</h2>
</div>
</div>
</div>

</div>

<div class="card shadow-sm mb-4">

<div class="card-header bg-success text-white">
Input Tugas
</div>

<div class="card-body">

<div class="row">

<div class="col-md-4 mb-3">
<input
id="namaTugas"
type="text"
class="form-control"
placeholder="Nama Tugas">
</div>

<div class="col-md-4 mb-3">
<select id="mataKuliah" class="form-select">
<option>Dasar Pemrograman Web</option>
<option> Dasar Pemrograman</option>
<option>Matematika</option>
<option>Pendidikan Pancasila</option>
<option>Pengantar Proyek Perangkat Lunak</option>
<option>Pengantar Teknologi Informasi</option>
<option>Sistem Komputer</option>
</select>
</div>

<div class="col-md-4 mb-3">
<input
id="deadline"
type="date"
class="form-control">
</div>

</div>

<button
id="btnTambah"
class="btn btn-primary">

Tambah Tugas

</button>

</div>

</div>

<div class="card shadow-sm mb-4">

<div class="card-body">

<div class="input-group">

<span class="input-group-text">
<i class="bi bi-search"></i>
</span>

<input
id="search"
type="text"
class="form-control"
placeholder="Cari Tugas">

</div>

</div>

</div>

<div class="card shadow-sm mb-4">

<div class="card-header bg-dark text-white">
Daftar Tugas
</div>

<div class="card-body table-responsive">

<table class="table table-hover table-striped">

<thead>

<tr>
<th>No</th>
<th>Tugas</th>
<th>Mata Kuliah</th>
<th>Deadline</th>
<th>Status</th>
<th>Aksi</th>
</tr>

</thead>

<tbody id="dataTugas">
</tbody>

</table>

</div>

</div>

<div class="card shadow-sm mb-4">

<div class="card-header bg-primary text-white">
Kalender Tugas
</div>

<div class="card-body">

<div id="calendar"></div>

</div>

</div>

<div class="card shadow-sm">

<div class="card-header bg-info text-white">
Laporan Sederhana
</div>

<div class="card-body">

<div class="row text-center">

<div class="col-md-4">
<h5>Total</h5>
<h2 id="laporanTotal">0</h2>
</div>

<div class="col-md-4">
<h5>Aktif</h5>
<h2 id="laporanAktif" class="text-primary">0</h2>
</div>

<div class="col-md-4">
<h5>Selesai</h5>
<h2 id="laporanSelesai" class="text-success">0</h2>
</div>

</div>

</div>

</div>

</div>

<script src="calendar.js"></script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
